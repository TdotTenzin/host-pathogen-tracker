[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathomap"
version = "0.4.0"
description = "PathoMap — a browsable curated host-pathogen interaction dataset"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.11.4",
    "pandas==2.2.3",
    "numpy==2.2.6",
    "networkx==3.5",
    "scikit-learn==1.7.1",
    "umap-learn==0.5.7",
    "biopython==1.85",
    "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]